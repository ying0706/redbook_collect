<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redbook Collect 配置</title>
  <style>
    body {
      width: 360px;
      margin: 40px auto;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafbfc;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h2 {
      color: #FF2442;
      text-align: center;
      margin-bottom: 24px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 15px;
      color: #666;
    }
    input {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 15px;
    }
    button {
      background-color: #FF2442;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #e61e3c;
    }
    .status {
      font-size: 15px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Redbook Collect 配置信息</h2>
  <div class="container">
    <div class="input-group">
      <label for="tableUrl">飞书多维表格 URL</label>
      <input type="text" id="tableUrl" placeholder="直接粘贴飞书多维表格 URL 即可">
    </div>
    <div class="input-group">
      <label for="appId">App ID</label>
      <input type="text" id="appId" placeholder="填写飞书应用的 app_id">
    </div>
    <div class="input-group">
      <label for="appSecret">App Secret</label>
      <input type="password" id="appSecret" placeholder="填写飞书应用的 app_secret">
    </div>
    <button id="saveConfig">保存配置</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
